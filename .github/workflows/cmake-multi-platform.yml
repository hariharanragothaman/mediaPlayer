name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
          sudo apt-get install -y libglu1-mesa-dev freeglut3-dev mesa-common-dev
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev
          sudo apt-get install -y libudev-dev libopenal-dev libvorbis-dev libflac-dev libfreetype-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release
